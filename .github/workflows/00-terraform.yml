name: 00 - Terraform Infrastructure

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - task-10.2d-infrastructure-security-monitoring
    paths:
      - "terraform/**"
      - ".github/workflows/00-terraform.yml"

jobs:
  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    env:
      TF_VAR_resource_group_name: koalatech-week08-rg
      TF_VAR_acr_name: avinashsit722w08acr1609
      TF_VAR_storage_account_name: avinashsit722w08stg1609
      TF_VAR_aks_cluster_name: avinash-sit722-week08-aks
      TF_VAR_aks_dns_prefix: koalatech-w08
      TF_VAR_environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false