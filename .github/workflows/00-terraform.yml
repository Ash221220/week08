name: 00 - Terraform Infrastructure

on:
  workflow_dispatch:

  push:
    branches:
      - task-10.2d-infrastructure-security-monitoring
    paths:
      - "terraform/**"
      - ".github/workflows/00-terraform.yml"

jobs:
  terraform:
    name: Terraform Provision Infrastructure
    runs-on: ubuntu-latest

    env:
      TF_VAR_resource_group_name: koalatech-week08-rg
      TF_VAR_acr_name: avinashsit722w08acr1609
      TF_VAR_storage_account_name: avinashsit722w08stg1609
      TF_VAR_aks_cluster_name: avinash-sit722-week08-aks
      TF_VAR_aks_dns_prefix: koalatech-w08
      TF_VAR_environment: development
      TF_VAR_aks_node_count: 2
      TF_VAR_aks_node_vm_size: Standard_D2s_v3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Terraform Azure authentication
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "ARM_CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.subscriptionId')" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId')" >> "$GITHUB_ENV"
          echo "ARM_USE_AZUREAD=true" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Verify Resource Group
        run: az group show --name koalatech-week08-rg --output table

      - name: Verify ACR
        run: az acr show --name avinashsit722w08acr1609 --resource-group koalatech-week08-rg --output table

      - name: Verify AKS
        run: az aks show --name avinash-sit722-week08-aks --resource-group koalatech-week08-rg --output table

      - name: Verify Storage Account
        run: az storage account show --name avinashsit722w08stg1609 --resource-group koalatech-week08-rg --output table