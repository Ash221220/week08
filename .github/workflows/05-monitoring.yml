name: 05 - Deploy Monitoring

on:
  workflow_dispatch:

jobs:
  deploy-monitoring:
    name: Deploy and Validate Prometheus and Grafana
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: koalatech-week08-rg
          cluster-name: avinash-sit722-week08-aks

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Add Prometheus Helm repository
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy Prometheus and Grafana
        run: |
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --version 91.8.1 \
            --namespace monitoring \
            --create-namespace \
            --values monitoring/values.yaml \
            --wait \
            --timeout 10m

      - name: Deploy KoalaTech Grafana dashboard
        run: |
          kubectl apply -f monitoring/grafana-dashboard.yaml

      - name: Validate monitoring pods
        run: |
          kubectl get pods -n monitoring
          kubectl wait \
            --for=condition=Ready \
            pod \
            --all \
            -n monitoring \
            --timeout=300s

      - name: Validate Prometheus deployment
        run: |
          kubectl rollout status statefulset/prometheus-monitoring-kube-prometheus-prometheus \
            -n monitoring \
            --timeout=300s

      - name: Validate Grafana deployment
        run: |
          kubectl rollout status deployment/monitoring-grafana \
            -n monitoring \
            --timeout=300s

      - name: Verify dashboard provisioning
        run: |
          kubectl get configmap koalatech-aks-monitoring-dashboard \
            -n monitoring \
            --show-labels

      - name: Display monitoring services
        run: |
          kubectl get svc -n monitoring