apiVersion: v1
kind: ConfigMap
metadata:
  name: koalatech-aks-monitoring-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  koalatech-aks-monitoring.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "type": "stat",
          "title": "AKS Ready Nodes",
          "description": "Number of AKS cluster nodes currently reporting a Ready status.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Running Kubernetes Pods",
          "description": "Total number of Kubernetes pods currently in the Running phase.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Cluster CPU Usage",
          "description": "CPU usage across the AKS cluster over time.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m]))",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": [
        "koalatech",
        "aks",
        "monitoring"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "KoalaTech AKS Monitoring - Provisioned",
      "uid": "koalatech-aks-provisioned",
      "version": 1
    }